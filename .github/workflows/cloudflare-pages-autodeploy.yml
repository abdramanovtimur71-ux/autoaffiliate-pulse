name: Cloudflare Pages AutoDeploy

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare config
        run: cp config.example.json config.json

      - name: Generate static site
        run: |
          python app.py --config config.json

      - name: Check Cloudflare credentials
        id: cf_check
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_PAGES_PROJECT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy is skipped: required secrets/vars are not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf_check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy site --project-name ${{ vars.CF_PAGES_PROJECT }} --branch main
